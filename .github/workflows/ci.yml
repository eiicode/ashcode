name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      # Native pieces (node-pty, sandbox FFI) are not needed for typecheck or
      # packaging, and skipping install scripts keeps CI fast and deterministic.
      # The ConPTY smoke suite cannot run here: it needs an installed copy,
      # a real terminal and a real API key. See CONTRIBUTING.md.
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Build release package
        shell: powershell
        run: ./scripts/pack.ps1
