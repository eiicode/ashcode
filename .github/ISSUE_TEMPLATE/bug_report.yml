name: Bug 报告
description: 报告一个可复现的问题
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        请先排除上游问题：切回官方 Web UI（`npx @deepseek-ai/dsh web`）后，同样的操作是否也会出问题？

  - type: textarea
    id: what-happened
    attributes:
      label: 现象
      description: 发生了什么？你期望的是什么？
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      placeholder: |
        1. 运行 ashcode
        2. 执行 /plan
        3. ...
    validations:
      required: true

  - type: input
    id: ashcode-version
    attributes:
      label: ashcode 版本
      description: 运行 `ashcode --version`
    validations:
      required: true

  - type: input
    id: runtimes
    attributes:
      label: Node / Bun 版本
      description: 运行 `node --version` 与 `bun --version`
    validations:
      required: true

  - type: input
    id: dsh-version
    attributes:
      label: DSH 版本
      description: 安装目录下 `node_modules/@deepseek-ai/dsh/package.json` 里的 `version`

  - type: dropdown
    id: terminal
    attributes:
      label: 终端
      options:
        - Windows Terminal
        - VS Code 集成终端
        - cmd / conhost
        - 其他
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志
      description: 设置 `ASHCODE_DEBUG=1` 后复现，把 `.tui-debug.log` 的相关片段贴在这里
      render: text

  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我已经确认这不是上游 dsh 的问题
          required: true
        - label: 内容里不含 API Key 或其他凭据
          required: true
